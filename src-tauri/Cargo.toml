[package]
name = "warehouse-inventory"
description = "Warehouse In/Out Inventory"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# staticlib/cdylib are needed for the Android build.
name = "warehouse_inventory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
inventory_types.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Windows / desktop: the hub with the embedded sync server.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
inventory_core = { path = "../crates/inventory_core", features = ["server"] }

# Android: sync client + QR scanner.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
inventory_core = { path = "../crates/inventory_core", features = ["client"] }
tauri-plugin-barcode-scanner = "2"
