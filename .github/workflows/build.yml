# Builds everything on GitHub's servers — no local setup needed.
#   * test     : runs the inventory_core tests (Linux)
#   * windows  : builds the .exe installer + .msi
#   * android  : builds and signs the .apk
# Download the results from the run page → "Artifacts".
# Push a tag like v0.1.0 to also publish them as a GitHub Release.

name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test -p inventory_core --all-features

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest
      - name: Android NDK path
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      # Android needs the Rust version of the Tauri CLI (Gradle calls it back).
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate icons and Android project
        run: |
          cargo tauri icon app-icon.png
          if [ ! -d src-tauri/gen/android ]; then cargo tauri android init --ci; fi
      - name: Build APK
        run: cargo tauri android build --apk --ci
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          echo "Unsigned APK: $UNSIGNED"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a temporary key. Phones must uninstall the old app before installing a new build. Add the secrets to keep the same key."
            PASS=temporary123; ALIAS=upload
            keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$ALIAS" -storepass "$PASS" -keypass "$PASS" -dname "CN=Warehouse Inventory"
          fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          mkdir -p dist
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out dist/WarehouseInventory.apk aligned.apk
          "$BT/apksigner" verify dist/WarehouseInventory.apk
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/WarehouseInventory.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/windows-installer/**/*
            out/android-apk/*.apk
