[workspace]
resolver = "2"
members = [
    "crates/inventory_types",
    "crates/inventory_core",
    "src-tauri",
    "ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
inventory_types = { path = "crates/inventory_types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"

[profile.release]
# Smaller, faster binaries for the installer / APK.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
