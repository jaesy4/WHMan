<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26456b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Requests">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Warehouse Requests</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #fff; --ink: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --navy: #26456b; --accent: #2f6fb3; --in: #1f8a4c; --in-bg: #e5f5ec; --out: #c2541b; --out-bg: #fcebe1;
    --warn: #b7791f; --warn-bg: #fff3df; --danger: #c53030; --danger-bg: #fdeaea; --radius: 10px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; color: var(--ink); background: var(--bg);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; font-weight: 650; }
  h2 { font-size: 1.08rem; }
  .muted { color: var(--muted); }
  .small { font-size: .84rem; }
  .hidden { display: none !important; }

  header.top { background: var(--navy); color: #fff; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  .mark { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.15); display: grid; place-items: center; font-weight: 700; }
  .top .title { flex: 1; min-width: 0; }
  .top .title b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .title span { font-size: .8rem; opacity: .8; }
  .top button { background: rgba(255,255,255,.12); border: 0; color: #fff; border-radius: 8px; padding: 7px 10px; font-size: .85rem; }

  nav.tabs { display: flex; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 58px; z-index: 4; }
  nav.tabs button { flex: 1; border: 0; background: none; padding: 12px 6px; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
  nav.tabs button.active { color: var(--navy); border-bottom-color: var(--navy); }
  .count { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--out); color: #fff; font-size: .75rem; margin-left: 4px; }

  main { max-width: 760px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field > span { font-size: .84rem; font-weight: 600; color: #374151; }
  .input { width: 100%; padding: 10px 12px; border: 1px solid #cfd5dd; border-radius: 8px; background: #fff; }
  .input:focus { outline: 2px solid rgba(47,111,179,.35); border-color: var(--accent); }
  textarea.input { resize: vertical; min-height: 60px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: 1px solid #cfd5dd; background: #fff; border-radius: 8px; padding: 10px 14px; font-weight: 600; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.ok { background: var(--in); border-color: var(--in); color: #fff; }
  .btn.danger { background: #fff; border-color: var(--danger); color: var(--danger); }
  .btn.full { width: 100%; padding: 13px; font-size: 1rem; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btn-row .btn { flex: 1 1 auto; }

  .login { max-width: 380px; margin: 9vh auto 0; }
  .login .mark { width: 54px; height: 54px; background: var(--navy); color: #fff; font-size: 1.4rem; border-radius: 14px; margin: 0 auto 10px; }
  .login h1 { text-align: center; font-size: 1.25rem; margin-bottom: 4px; }
  .login p { text-align: center; margin: 0 0 18px; }

  .results { border: 1px solid var(--line); border-radius: 8px; max-height: 280px; overflow-y: auto; margin-top: 6px; }
  .result { display: flex; gap: 10px; width: 100%; text-align: left; align-items: center; border: 0; border-bottom: 1px solid var(--line); background: #fff; padding: 10px 12px; }
  .result:last-child { border-bottom: 0; }
  .result:hover { background: #f1f5fa; }
  .result .name { flex: 1; min-width: 0; }
  .code { font-family: Consolas, Menlo, monospace; font-size: .8rem; background: #eef2f7; padding: 1px 6px; border-radius: 4px; color: var(--navy); }
  .bal { white-space: nowrap; font-size: .85rem; color: var(--muted); }
  .bal.zero { color: var(--danger); }

  .line { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .line-head { display: flex; gap: 8px; align-items: flex-start; }
  .line-head .grow { flex: 1; min-width: 0; }
  .x { border: 0; background: none; color: var(--muted); font-size: 1.1rem; padding: 0 4px; }
  .line .grid2 { margin-top: 8px; }
  .qty { font-size: 1.05rem; font-weight: 650; }
  .warnline { color: var(--warn); font-size: .8rem; margin-top: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 22px 10px; }

  .req { cursor: pointer; }
  .req-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .req-num { font-weight: 700; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .s-SUBMITTED { background: var(--warn-bg); color: var(--warn); }
  .s-APPROVED { background: #e6eefa; color: var(--accent); }
  .s-ISSUED { background: var(--in-bg); color: var(--in); }
  .s-RECEIVED { background: #e9ecef; color: #374151; }
  .s-REJECTED, .s-CANCELLED { background: var(--danger-bg); color: var(--danger); }
  .req ul { margin: 8px 0 0; padding-left: 18px; }
  .req li { margin: 2px 0; }
  .detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .timeline { list-style: none; padding: 0 !important; margin: 8px 0 0 !important; font-size: .85rem; }
  .timeline li { padding-left: 14px; position: relative; color: #374151; }
  .timeline li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; margin-top: 6px; }
  th { text-align: left; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .num { text-align: right; white-space: nowrap; }
  .note { background: #f8fafc; border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 4px; font-size: .88rem; margin-top: 8px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: .82rem; }
  .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1d2330; color: #fff;
    padding: 11px 16px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 24px); z-index: 20; }
  .toast.error { background: var(--danger); }
  .modal-back { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: grid; place-items: center; z-index: 15; padding: 14px; }
  .modal { background: #fff; border-radius: 12px; padding: 18px; width: 100%; max-width: 420px; }
  .modal h2 { margin-bottom: 10px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } .line .grid2 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
(function () {
  // localStorage can be unavailable (private mode); fall back to memory.
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return mem[k] || null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) { mem[k] = v; } },
    del(k) { try { localStorage.removeItem(k); } catch (_) { delete mem[k]; } },
  };

  const S = {
    token: store.get("whman_token") || "",
    user: null,
    org: "",
    tab: "new",
    items: [],
    itemsLoaded: false,
    cart: [],          // {item, qty, remarks}
    purpose: "",
    neededBy: "",
    search: "",
    requests: [],
    filter: "open",
    expanded: null,
    busy: false,
  };

  // ---------------------------------------------------------------- helpers
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else if (k === "value") el.value = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.appendChild(typeof kid === "string" || typeof kid === "number" ? document.createTextNode(String(kid)) : kid);
    }
    return el;
  }
  function fq(q) {
    const n = Math.round(Number(q) * 1000) / 1000;
    return n.toLocaleString("en-US", { maximumFractionDigits: 3 });
  }
  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  const STATUS = {
    SUBMITTED: "Waiting approval", APPROVED: "Approved", REJECTED: "Rejected",
    CANCELLED: "Cancelled", ISSUED: "Issued", RECEIVED: "Received",
  };
  // Serde sends enum variants as "Submitted"; normalise to upper case.
  const st = (s) => String(s || "").toUpperCase();
  const isHead = () => S.user && String(S.user.role).toLowerCase() === "head";

  let toastTimer;
  function toast(msg, error) {
    document.querySelectorAll(".toast").forEach((t) => t.remove());
    const t = h("div", { class: "toast" + (error ? " error" : ""), onclick: () => t.remove() }, msg);
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), error ? 6000 : 3000);
  }

  async function api(method, path, body) {
    const opts = { method, headers: {} };
    if (S.token) opts.headers["Authorization"] = "Bearer " + S.token;
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    let res;
    try {
      res = await fetch(path, opts);
    } catch (_) {
      throw new Error("Cannot reach the warehouse PC. Check your internet, or the PC may be off.");
    }
    let data = null;
    try { data = await res.json(); } catch (_) { /* empty body */ }
    if (res.status === 401 && path !== "/api/login") {
      logoutLocal();
      throw new Error((data && data.error) || "Please log in again.");
    }
    if (!res.ok) {
      if (res.status === 502 || res.status === 503 || res.status === 504) {
        throw new Error("The warehouse PC app is not running right now. Try again later.");
      }
      throw new Error((data && data.error) || "Error " + res.status);
    }
    return data;
  }

  function logoutLocal() {
    S.token = ""; S.user = null; S.requests = []; S.items = []; S.itemsLoaded = false; S.cart = [];
    store.del("whman_token");
    document.querySelectorAll(".toast, .modal-back").forEach((t) => t.remove());
    render();
  }

  // ---------------------------------------------------------------- data
  async function loadItems() {
    try {
      S.items = await api("GET", "/api/items");
      S.itemsLoaded = true;
      render();
    } catch (e) { toast(e.message, true); }
  }
  async function loadRequests(quiet) {
    try {
      S.requests = await api("GET", "/api/requests");
      render();
    } catch (e) { if (!quiet) toast(e.message, true); }
  }

  // ---------------------------------------------------------------- views
  function viewLogin() {
    let u = "", p = "";
    const submit = async (ev) => {
      ev.preventDefault();
      const btn = ev.target.querySelector("button");
      btn.disabled = true;
      try {
        const r = await api("POST", "/api/login", { username: u, password: p });
        S.token = r.token; S.user = r.user; S.org = r.warehouse_name || "";
        store.set("whman_token", r.token);
        S.tab = isHead() ? "approve" : "new";
        render();
        loadItems(); loadRequests();
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false;
      }
    };
    return h("div", { class: "login" },
      h("div", { class: "panel" },
        h("div", { class: "mark" }, "W"),
        h("h1", {}, "Warehouse Requests"),
        h("p", { class: "muted small" }, "Engineering · Solar Team"),
        h("form", { onsubmit: submit },
          h("label", { class: "field" }, h("span", {}, "Username"),
            h("input", { class: "input", autocomplete: "username", autocapitalize: "none", required: true, oninput: (e) => (u = e.target.value) })),
          h("label", { class: "field" }, h("span", {}, "Password"),
            h("input", { class: "input", type: "password", autocomplete: "current-password", required: true, oninput: (e) => (p = e.target.value) })),
          h("button", { class: "btn primary full", type: "submit" }, "Log in"),
        ),
        h("p", { class: "muted small", style: "margin-top:14px" }, "No account yet? Ask the warehouse to create one for you."),
      ));
  }

  function header() {
    return h("header", { class: "top" },
      h("div", { class: "mark" }, "W"),
      h("div", { class: "title" },
        h("b", {}, S.org || "Warehouse Requests"),
        h("span", {}, S.user.full_name + " · " + S.user.department_name + (isHead() ? " (Head)" : ""))),
      h("button", { onclick: openPasswordDialog, title: "Change password" }, "🔑"),
      h("button", { onclick: async () => { try { await api("POST", "/api/logout"); } catch (_) {} logoutLocal(); } }, "Log out"));
  }

  function tabs() {
    const pending = S.requests.filter((r) => st(r.status) === "SUBMITTED").length;
    const tab = (id, label, extra) => h("button", {
      class: S.tab === id ? "active" : "",
      onclick: () => { S.tab = id; S.expanded = null; render(); if (id !== "new") loadRequests(true); },
    }, label, extra);
    return h("nav", { class: "tabs" },
      tab("new", "New request", S.cart.length ? h("span", { class: "count" }, S.cart.length) : null),
      tab("list", "Requests"),
      isHead() ? tab("approve", "To approve", pending ? h("span", { class: "count" }, pending) : null) : null);
  }

  function viewNew() {
    const q = S.search.trim().toLowerCase();
    const inCart = new Set(S.cart.map((c) => c.item.id));
    const matches = q
      ? S.items.filter((i) => !inCart.has(i.id) &&
          (i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q) || (i.location || "").toLowerCase().includes(q))).slice(0, 40)
      : [];

    const searchBox = h("input", {
      class: "input", id: "search", placeholder: "Search item name or code…", value: S.search, autocomplete: "off",
      oninput: (e) => { S.search = e.target.value; render(); focusEnd("search"); },
    });

    const results = q ? h("div", { class: "results" },
      matches.length ? matches.map((i) => h("button", {
        class: "result",
        onclick: () => { S.cart.push({ item: i, qty: "", remarks: "" }); S.search = ""; render(); focusEnd("qty-" + i.id); },
      },
        h("span", { class: "code" }, i.code),
        h("span", { class: "name" }, i.name),
        h("span", { class: "bal" + (i.balance <= 0 ? " zero" : "") }, i.balance <= 0 ? "Out of stock" : fq(i.balance) + " " + i.unit),
      )) : h("div", { class: "empty small" }, S.itemsLoaded ? "No matching items." : "Loading items…"),
    ) : null;

    const lines = S.cart.map((c, idx) => {
      const n = parseFloat(String(c.qty).replace(/,/g, ""));
      const over = n > 0 && n > c.item.balance;
      return h("div", { class: "line" },
        h("div", { class: "line-head" },
          h("div", { class: "grow" },
            h("div", {}, h("span", { class: "code" }, c.item.code), " ", c.item.name),
            h("div", { class: "muted small" }, "In stock: " + fq(c.item.balance) + " " + c.item.unit)),
          h("button", { class: "x", title: "Remove", onclick: () => { S.cart.splice(idx, 1); render(); } }, "✕")),
        h("div", { class: "grid2" },
          h("label", { class: "field", style: "margin:0" }, h("span", {}, "Quantity (" + (c.item.unit || "unit") + ") *"),
            h("input", { class: "input qty", id: "qty-" + c.item.id, inputmode: "decimal", placeholder: "0", value: c.qty,
              oninput: (e) => { c.qty = e.target.value; const w = e.target.closest(".line").querySelector(".warnline");
                const v = parseFloat(String(c.qty).replace(/,/g, "")); if (w) w.classList.toggle("hidden", !(v > c.item.balance)); } })),
          h("label", { class: "field", style: "margin:0" }, h("span", {}, "Remarks"),
            h("input", { class: "input", placeholder: "Optional", value: c.remarks, oninput: (e) => (c.remarks = e.target.value) }))),
        h("div", { class: "warnline" + (over ? "" : " hidden") }, "More than the current stock — the warehouse may issue less."));
    });

    const submit = async () => {
      if (!S.cart.length) return toast("Add at least one item.", true);
      const out = [];
      for (const c of S.cart) {
        const n = parseFloat(String(c.qty).replace(/,/g, ""));
        if (!(n > 0)) return toast("Enter a quantity for " + c.item.name + ".", true);
        out.push({ item_id: c.item.id, qty: n, remarks: c.remarks });
      }
      if (!S.purpose.trim()) return toast("Please write the purpose (project, site, job order…).", true);
      S.busy = true; render();
      try {
        const r = await api("POST", "/api/requests", { purpose: S.purpose, needed_by: S.neededBy, lines: out });
        toast("Request " + r.number + " sent" + (st(r.status) === "APPROVED" ? " and approved." : ". Waiting for approval."));
        S.cart = []; S.purpose = ""; S.neededBy = "";
        S.tab = "list"; S.filter = "open"; S.expanded = r.id;
        await loadRequests();
      } catch (e) { toast(e.message, true); }
      S.busy = false; render();
    };

    return [
      h("section", { class: "panel" },
        h("h2", {}, "1. Add items"),
        h("p", { class: "muted small", style: "margin:4px 0 10px" }, "Search the warehouse stock and tap an item to add it."),
        searchBox, results),
      h("section", { class: "panel" },
        h("h2", { style: "margin-bottom:10px" }, "2. Quantities"),
        lines.length ? lines : h("div", { class: "empty" }, "No items yet.")),
      h("section", { class: "panel" },
        h("h2", { style: "margin-bottom:10px" }, "3. Details"),
        h("label", { class: "field" }, h("span", {}, "Purpose *"),
          h("textarea", { class: "input", placeholder: "e.g. Solar installation at Brgy. San Jose, Job Order 1123", oninput: (e) => (S.purpose = e.target.value) }, S.purpose)),
        h("label", { class: "field" }, h("span", {}, "Needed by"),
          h("input", { class: "input", type: "date", min: today(), value: S.neededBy, oninput: (e) => (S.neededBy = e.target.value) })),
        h("button", { class: "btn primary full", disabled: S.busy, onclick: submit },
          S.busy ? "Sending…" : isHead() ? "Send request (auto-approved)" : "Send request")),
    ];
  }

  function reqCard(r) {
    const s = st(r.status);
    const open = S.expanded === r.id;
    const mine = r.requested_by === S.user.full_name;
    const lines = r.lines || [];
    const summary = lines.slice(0, 3).map((l) => h("li", {}, fq(l.qty_requested) + " " + l.unit + " · " + l.item_name));
    if (lines.length > 3) summary.push(h("li", { class: "muted" }, "+ " + (lines.length - 3) + " more"));

    const act = (label, cls, fn) => h("button", { class: "btn " + cls, onclick: (e) => { e.stopPropagation(); fn(); } }, label);
    const actions = [];
    if (open) {
      if (isHead() && s === "SUBMITTED") {
        actions.push(act("✓ Approve", "ok", () => decide(r, "approve")));
        actions.push(act("Reject", "danger", () => decide(r, "reject")));
      }
      if ((s === "SUBMITTED" || s === "APPROVED") && (mine || isHead())) {
        actions.push(act("Cancel request", "", () => decide(r, "cancel")));
      }
      if (s === "ISSUED") actions.push(act("✓ We received the items", "ok", () => decide(r, "received")));
    }

    const timeline = [h("li", {}, "Requested by " + r.requested_by + " · " + r.created_at)];
    if (r.approved_at && s !== "REJECTED") timeline.push(h("li", {}, "Approved by " + r.approved_by + " · " + r.approved_at));
    if (s === "REJECTED") timeline.push(h("li", {}, "Rejected by " + r.approved_by + " · " + r.approved_at));
    if (r.issued_at) timeline.push(h("li", {}, "Issued by " + r.issued_by + " · " + r.issued_at));
    if (r.received_at) timeline.push(h("li", {}, "Received by " + r.received_by + " · " + r.received_at));

    const issuedStage = s === "ISSUED" || s === "RECEIVED";
    return h("section", { class: "panel req", onclick: () => { S.expanded = open ? null : r.id; render(); } },
      h("div", { class: "req-head" },
        h("div", {}, h("span", { class: "req-num" }, r.number), " ", h("span", { class: "muted small" }, r.created_at.slice(0, 10))),
        h("span", { class: "badge s-" + s }, STATUS[s] || s)),
      h("div", { class: "small", style: "margin-top:6px" }, r.purpose),
      h("div", { class: "muted small" }, "By " + r.requested_by + (r.needed_by ? " · needed by " + r.needed_by : "")),
      open ? h("div", { class: "detail", onclick: (e) => e.stopPropagation() },
        h("table", {},
          h("thead", {}, h("tr", {}, h("th", {}, "Item"), h("th", { class: "num" }, "Requested"), issuedStage ? h("th", { class: "num" }, "Issued") : null)),
          h("tbody", {}, lines.map((l) => h("tr", {},
            h("td", {}, h("span", { class: "code" }, l.item_code), " ", l.item_name, l.remarks ? h("div", { class: "muted small" }, l.remarks) : null),
            h("td", { class: "num" }, fq(l.qty_requested) + " " + l.unit),
            issuedStage ? h("td", { class: "num", style: l.qty_issued < l.qty_requested ? "color:var(--warn);font-weight:600" : "" }, fq(l.qty_issued) + " " + l.unit) : null)))),
        r.decision_note ? h("div", { class: "note" }, r.decision_note) : null,
        h("ul", { class: "timeline" }, timeline),
        actions.length ? h("div", { class: "btn-row" }, actions) : null,
      ) : h("ul", {}, summary));
  }

  function viewList(onlyPending) {
    let list = S.requests;
    if (onlyPending) list = list.filter((r) => st(r.status) === "SUBMITTED");
    else if (S.filter === "open") list = list.filter((r) => ["SUBMITTED", "APPROVED", "ISSUED"].includes(st(r.status)));
    else if (S.filter === "done") list = list.filter((r) => !["SUBMITTED", "APPROVED", "ISSUED"].includes(st(r.status)));
    const chip = (id, label) => h("button", { class: "chip" + (S.filter === id ? " active" : ""), onclick: () => { S.filter = id; render(); } }, label);
    return [
      onlyPending
        ? h("p", { class: "muted small", style: "margin:0" }, "Requests from your team waiting for your approval. Tap one to see the items.")
        : h("div", { class: "chips" }, chip("open", "In progress"), chip("done", "Finished"), chip("all", "All"),
            h("button", { class: "chip", onclick: () => loadRequests() }, "↻ Refresh")),
      list.length ? list.map(reqCard) : h("div", { class: "panel empty" }, onlyPending ? "Nothing to approve. 👍" : "No requests here yet."),
    ];
  }

  // ---------------------------------------------------------------- dialogs
  function modal(title, body, okLabel, okClass, onOk) {
    const back = h("div", { class: "modal-back", onclick: (e) => { if (e.target === back) back.remove(); } });
    const okBtn = h("button", { class: "btn " + okClass }, okLabel);
    okBtn.addEventListener("click", async () => {
      okBtn.disabled = true;
      try { if ((await onOk()) !== false) back.remove(); } finally { okBtn.disabled = false; }
    });
    back.appendChild(h("div", { class: "modal" }, h("h2", {}, title), body,
      h("div", { class: "btn-row" }, h("button", { class: "btn", onclick: () => back.remove() }, "Close"), okBtn)));
    document.body.appendChild(back);
    const first = back.querySelector("input, textarea");
    if (first) first.focus();
  }

  function decide(r, action) {
    const cfg = {
      approve: ["Approve " + r.number + "?", "Note (optional)", "Approve", "ok", false],
      reject: ["Reject " + r.number + "?", "Reason *", "Reject", "danger", true],
      cancel: ["Cancel " + r.number + "?", "Reason (optional)", "Cancel request", "danger", false],
      received: ["Confirm received", null, "Yes, received", "ok", false],
    }[action];
    let note = "";
    const body = cfg[1]
      ? h("label", { class: "field" }, h("span", {}, cfg[1]), h("textarea", { class: "input", oninput: (e) => (note = e.target.value) }))
      : h("p", {}, "Confirm that " + S.user.department_name + " received the items for " + r.number + ".");
    modal(cfg[0], body, cfg[2], cfg[3], async () => {
      if (cfg[4] && !note.trim()) { toast("Please give a reason.", true); return false; }
      try {
        const updated = await api("POST", "/api/requests/" + encodeURIComponent(r.id) + "/" + action, { note });
        S.requests = S.requests.map((x) => (x.id === updated.id ? updated : x));
        toast(r.number + ": " + (STATUS[st(updated.status)] || updated.status));
        render();
      } catch (e) { toast(e.message, true); return false; }
    });
  }

  function openPasswordDialog() {
    let oldp = "", newp = "", again = "";
    const body = h("div", {},
      h("label", { class: "field" }, h("span", {}, "Current password"), h("input", { class: "input", type: "password", autocomplete: "current-password", oninput: (e) => (oldp = e.target.value) })),
      h("label", { class: "field" }, h("span", {}, "New password (at least 6 characters)"), h("input", { class: "input", type: "password", autocomplete: "new-password", oninput: (e) => (newp = e.target.value) })),
      h("label", { class: "field" }, h("span", {}, "Repeat new password"), h("input", { class: "input", type: "password", autocomplete: "new-password", oninput: (e) => (again = e.target.value) })));
    modal("Change password", body, "Save", "primary", async () => {
      if (newp !== again) { toast("The new passwords do not match.", true); return false; }
      try { await api("POST", "/api/password", { old: oldp, new: newp }); toast("Password changed."); }
      catch (e) { toast(e.message, true); return false; }
    });
  }

  // ---------------------------------------------------------------- render
  function focusEnd(id) {
    const el = document.getElementById(id);
    if (el) { el.focus(); try { const n = el.value.length; el.setSelectionRange(n, n); } catch (_) {} }
  }

  function render() {
    const app = document.getElementById("app");
    const y = window.scrollY;
    app.replaceChildren();
    if (!S.token || !S.user) {
      document.title = "Warehouse Requests";
      app.appendChild(viewLogin());
      return;
    }
    document.title = (S.org ? S.org + " · " : "") + "Requests";
    app.appendChild(header());
    app.appendChild(tabs());
    const main = h("main", {});
    const content = S.tab === "new" ? viewNew() : S.tab === "approve" ? viewList(true) : viewList(false);
    [content].flat(Infinity).forEach((n) => n && main.appendChild(n));
    app.appendChild(main);
    window.scrollTo(0, y);
  }

  // ---------------------------------------------------------------- start
  async function start() {
    if (!S.token) return render();
    try {
      const me = await api("GET", "/api/me");
      S.user = me.user; S.org = me.warehouse_name || "";
      if (isHead()) S.tab = "approve";
      render();
      loadItems(); loadRequests();
    } catch (e) {
      render();
      if (S.token) toast(e.message, true);
    }
  }
  // Refresh in the background so status changes show up.
  setInterval(() => { if (S.user && S.tab !== "new" && !document.hidden) loadRequests(true); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.user) { loadRequests(true); loadItems(); } });
  start();
})();
</script>
</body>
</html>
