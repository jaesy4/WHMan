[package]
name = "inventory_core"
description = "Warehouse In/Out inventory: SQLite storage, Excel import/export, PDF reports, LAN sync."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Desktop (hub): embedded HTTP sync server.
server = ["dep:axum", "dep:tokio", "dep:qrcode"]
# Phone: HTTP client that syncs with the desktop hub.
client = ["dep:reqwest", "dep:tokio"]

[dependencies]
inventory_types.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true

# SQLite compiled into the app: nothing to install on Windows or Android.
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }

# Excel
calamine = "0.37"
rust_xlsxwriter = "0.80"

# Request signing for sync (HMAC-SHA256)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Optional: sync server (desktop)
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"], optional = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }

# Optional: sync client (phone). Plain HTTP on the LAN, so no TLS stack needed;
# requests are signed with HMAC instead.
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
